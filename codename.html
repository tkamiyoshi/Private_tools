<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コードネームジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121214; --panel: #1c1c20; --line: #2e2e34; --fg: #ecebe8; --sub: #9a9893;
    --accent: #c8102e; --accent-soft: rgba(200,16,46,.15); --gold: #d4a73a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font: 800 26px/1.2 "Shippori Mincho", serif; margin: 0 0 4px; letter-spacing: .05em; }
  h1 small { display: block; font: 700 11px/1 "Noto Sans JP", sans-serif; letter-spacing: .4em; color: var(--accent); margin-bottom: 8px; }
  .lead { color: var(--sub); font-size: 13px; margin: 0 0 20px; }

  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .box h2 { font-size: 12px; letter-spacing: .15em; color: var(--sub); margin: 0 0 10px; font-weight: 700; }

  .syn { display: flex; flex-wrap: wrap; gap: 6px; }
  .syn label {
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    user-select: none; transition: .12s;
  }
  .syn input { display: none; }
  .syn label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  .opts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; font-size: 13px; }
  .opts select { background: #111; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }

  .locks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; min-height: 30px; }
  .lock-chip { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 8px 3px 10px; display: inline-flex; gap: 8px; align-items: center; }
  .lock-chip button { background: none; border: 0; color: var(--sub); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .muted { color: var(--sub); font-size: 12px; }

  .actions { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  button.main {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 28px;
    font: 700 16px "Noto Sans JP", sans-serif; cursor: pointer; letter-spacing: .1em;
  }
  button.sub { background: #2a2a30; color: var(--fg); border: 0; border-radius: 8px; padding: 12px 16px; font: 14px "Noto Sans JP", sans-serif; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .item {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 14px 10px;
    position: relative; overflow: hidden;
  }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .7; }
  .name { font: 800 22px/2.1 "Shippori Mincho", "Yu Mincho", serif; word-break: keep-all; overflow-wrap: anywhere; }
  .name ruby rt { font: 400 10px "Noto Sans JP", sans-serif; color: var(--sub); letter-spacing: .08em; }
  .part { cursor: pointer; border-radius: 4px; transition: background .12s; }
  .part:hover { background: var(--accent-soft); }
  .part.locked { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .reading { font-size: 12px; color: var(--sub); letter-spacing: .05em; margin-top: 2px; }
  .tools { display: flex; gap: 4px; justify-content: flex-end; margin-top: 8px; }
  .tools button {
    background: none; border: 1px solid var(--line); color: var(--sub); border-radius: 6px;
    font: 12px "Noto Sans JP", sans-serif; padding: 4px 9px; cursor: pointer;
  }
  .tools button:hover { color: var(--fg); border-color: var(--sub); }
  .tools button.on { color: var(--gold); border-color: var(--gold); }

  .favs { margin-top: 28px; }
  .favs h2 { font: 800 18px "Shippori Mincho", serif; margin: 0 0 10px; }
  .fav-list { display: flex; flex-direction: column; gap: 6px; }
  .fav-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .fav-row .txt { flex: 1; font: 700 16px "Shippori Mincho", serif; }
  .fav-row .txt span { font: 12px "Noto Sans JP", sans-serif; color: var(--sub); margin-left: 8px; }
  .fav-row button { background: none; border: 0; color: var(--sub); cursor: pointer; font-size: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: #fff; color: #111; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  details.custom summary { cursor: pointer; font-size: 12px; color: var(--sub); letter-spacing: .15em; font-weight: 700; }
  details.custom textarea {
    width: 100%; min-height: 90px; margin-top: 8px; background: #111; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font: 13px/1.6 "Noto Sans JP", monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1><small>DOUBLE CROSS 3rd</small>コードネームジェネレーター</h1>
  <p class="lead">シンドロームを選んで「生成」。前半・後半をクリックすると固定され、残りだけ振り直せます。</p>

  <div class="box">
    <h2>シンドローム（複数選択可・未選択なら全部）</h2>
    <div class="syn" id="syn"></div>
  </div>

  <div class="box">
    <h2>オプション</h2>
    <div class="opts">
      <label>つなぎ方
        <select id="joint">
          <option value="mix">おまかせ</option>
          <option value="no">「〜の〜」を優先</option>
          <option value="naru">「〜なる〜」を優先</option>
        </select>
      </label>
      <label>ルビの区切り
        <select id="sep">
          <option value="・">・（ナカグロ）</option>
          <option value="">なし</option>
          <option value=" ">スペース</option>
        </select>
      </label>
      <label>生成数
        <select id="count">
          <option>6</option><option selected>12</option><option>24</option>
        </select>
      </label>
    </div>
  </div>

  <div class="box">
    <h2>固定中の単語</h2>
    <div class="locks" id="locks"><span class="muted">なし（結果の前半・後半をクリックで固定）</span></div>
  </div>

  <div class="box">
    <details class="custom">
      <summary>自分の単語を追加する</summary>
      <p class="muted">1行に1語。「前|漢字|ルビ」または「後|漢字|ルビ」の形式で書いてください。前半に置く語は「紅蓮の」「怒れる」のように、つなぎの言葉まで含めて書きます。<br>例）前|硝子の|グラス　　後|探偵|ディテクティヴ</p>
      <textarea id="custom" spellcheck="false"></textarea>
    </details>
  </div>

  <div class="actions">
    <button class="main" id="gen">生成</button>
    <button class="sub" id="clearLock">固定を解除</button>
  </div>

  <div class="grid" id="out"></div>

  <section class="favs">
    <h2>お気に入り</h2>
    <div class="fav-list" id="favs"><p class="muted">★を押すとここに保存されます。</p></div>
  </section>
</div>
<div class="toast" id="toast"></div>

/* ============================================================ */
const parse = (txt, tag, isMod) => txt.trim().split('\n').filter(Boolean).map(l => {
  const [jp, ru, type] = l.split('|').map(s => s.trim());
  return isMod ? { jp, ru, type: type || 'a', tag } : { jp, ru, tag };
});
const ALL_MODS = Object.entries(MODS).flatMap(([t, s]) => parse(s, t, true));
const ALL_NOUNS = Object.entries(NOUNS).flatMap(([t, s]) => parse(s, t, false));

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];

let locks = { mod: null, noun: null };
let favs = [];
let current = [];

function customWords() {
  const mods = [], nouns = [];
  for (const line of $('custom').value.split('\n')) {
    const p = line.split('|').map(s => s.trim());
    if (p.length < 3 || !p[1] || !p[2]) continue;
    if (p[0] === '前') mods.push({ jp: p[1], ru: p[2], type: 'a', tag: 'C' });
    else if (p[0] === '後') nouns.push({ jp: p[1], ru: p[2], tag: 'C' });
  }
  return { mods, nouns };
}

// 選択シンドロームの語を重めに、共通語も混ぜる
function weightedPool(list, selected, custom) {
  if (!selected.length) return [...list, ...custom, ...custom];
  const pool = [];
  for (const w of list) {
    if (selected.includes(w.tag)) pool.push(w, w, w, w);
    else if (w.tag === 'G') pool.push(w);
  }
  return [...pool, ...custom, ...custom, ...custom];
}

function connector(mod) {
  if (mod.type === 'a') return '';
  const j = $('joint').value;
  const naruRate = j === 'naru' ? 0.75 : j === 'no' ? 0.1 : 0.35;
  return Math.random() < naruRate ? 'なる' : 'の';
}

function generate() {
  const selected = [...document.querySelectorAll('#syn input:checked')].map(i => i.value);
  const cw = customWords();
  const modPool = weightedPool(ALL_MODS, selected, cw.mods);
  const nounPool = weightedPool(ALL_NOUNS, selected, cw.nouns);
  const n = +$('count').value;
  const seen = new Set();
  current = [];
  for (let tries = 0; current.length < n && tries < n * 30; tries++) {
    const mod = locks.mod ? locks.mod.mod : pick(modPool);
    const noun = locks.noun || pick(nounPool);
    if (mod.jp.replace(/の$/, '') === noun.jp) continue;
    const conn = locks.mod ? locks.mod.conn : connector(mod);
    const key = mod.jp + conn + noun.jp;
    if (seen.has(key)) continue;
    seen.add(key);
    current.push({ mod, conn, noun });
  }
  renderOut();
}

const reading = c => c.mod.ru + $('sep').value + c.noun.ru;
const plain = c => `${c.mod.jp}${c.conn}${c.noun.jp}(${reading(c)})`;
const isFav = c => favs.some(f => f.text === plain(c));

function renderOut() {
  $('out').innerHTML = current.map((c, i) => `
    <div class="item">
      <div class="name"><ruby><span class="part ${locks.mod && locks.mod.mod.jp === c.mod.jp ? 'locked' : ''}" data-i="${i}" data-part="mod" title="クリックで固定">${esc(c.mod.jp + c.conn)}</span><span class="part ${locks.noun && locks.noun.jp === c.noun.jp ? 'locked' : ''}" data-i="${i}" data-part="noun" title="クリックで固定">${esc(c.noun.jp)}</span><rt>${esc(reading(c))}</rt></ruby></div>
      <div class="tools">
        <button data-act="copy" data-i="${i}">コピー</button>
        <button data-act="fav" data-i="${i}" class="${isFav(c) ? 'on' : ''}">${isFav(c) ? '★' : '☆'}</button>
      </div>
    </div>`).join('');
}

function renderLocks() {
  const chips = [];
  if (locks.mod) chips.push(`<span class="lock-chip">前半：${esc(locks.mod.mod.jp + locks.mod.conn)}<button data-unlock="mod">×</button></span>`);
  if (locks.noun) chips.push(`<span class="lock-chip">後半：${esc(locks.noun.jp)}<button data-unlock="noun">×</button></span>`);
  $('locks').innerHTML = chips.length ? chips.join('') : '<span class="muted">なし（結果の前半・後半をクリックで固定）</span>';
}

function renderFavs() {
  $('favs').innerHTML = favs.length
    ? favs.map((f, i) => `<div class="fav-row"><div class="txt">${esc(f.jp)}<span>${esc(f.ru)}</span></div><button data-fcopy="${i}">コピー</button><button data-fdel="${i}">削除</button></div>`).join('')
    : '<p class="muted">★を押すとここに保存されます。</p>';
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('コピーしました：' + text); }
  catch (e) { prompt('コピーしてください', text); }
}

function save() {
  try {
    localStorage.setItem('dx-codename-v1', JSON.stringify({
      favs, custom: $('custom').value,
      syn: [...document.querySelectorAll('#syn input:checked')].map(i => i.value),
      joint: $('joint').value, sep: $('sep').value, count: $('count').value,
    }));
  } catch (e) {}
}

/* ---------- 初期化 ---------- */
(function init() {
  $('syn').innerHTML = Object.entries(SYNDROMES).filter(([k]) => k !== 'G')
    .map(([k, v]) => `<label><input type="checkbox" value="${k}">${v.name}</label>`).join('');

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('dx-codename-v1')); } catch (e) {}
  if (saved) {
    favs = saved.favs || [];
    $('custom').value = saved.custom || '';
    for (const k of saved.syn || []) { const el = document.querySelector(`#syn input[value="${k}"]`); if (el) el.checked = true; }
    if (saved.joint) $('joint').value = saved.joint;
    if (saved.sep !== undefined) $('sep').value = saved.sep;
    if (saved.count) $('count').value = saved.count;
  }

  $('gen').addEventListener('click', () => { generate(); save(); });
  $('clearLock').addEventListener('click', () => { locks = { mod: null, noun: null }; renderLocks(); renderOut(); });
  $('sep').addEventListener('change', () => { renderOut(); save(); });
  for (const id of ['joint', 'count', 'custom']) $(id).addEventListener('change', save);
  $('syn').addEventListener('change', save);

  $('out').addEventListener('click', e => {
    const part = e.target.closest('.part');
    if (part) {
      const c = current[+part.dataset.i];
      if (part.dataset.part === 'mod') {
        locks.mod = locks.mod && locks.mod.mod.jp === c.mod.jp ? null : { mod: c.mod, conn: c.conn };
      } else {
        locks.noun = locks.noun && locks.noun.jp === c.noun.jp ? null : c.noun;
      }
      renderLocks(); renderOut();
      return;
    }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const c = current[+btn.dataset.i];
    if (btn.dataset.act === 'copy') copy(plain(c));
    if (btn.dataset.act === 'fav') {
      const text = plain(c);
      const idx = favs.findIndex(f => f.text === text);
      if (idx >= 0) favs.splice(idx, 1);
      else favs.unshift({ text, jp: c.mod.jp + c.conn + c.noun.jp, ru: reading(c) });
      renderOut(); renderFavs(); save();
    }
  });
  $('locks').addEventListener('click', e => {
    const b = e.target.closest('[data-unlock]');
    if (!b) return;
    locks[b.dataset.unlock] = null; renderLocks(); renderOut();
  });
  $('favs').addEventListener('click', e => {
    const c = e.target.closest('[data-fcopy]'), d = e.target.closest('[data-fdel]');
    if (c) copy(favs[+c.dataset.fcopy].text);
    if (d) { favs.splice(+d.dataset.fdel, 1); renderFavs(); save(); }
  });

  renderFavs();
  generate();
})();
</script>
</body>
</html>
